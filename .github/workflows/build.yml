name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Siapkan sumber (unzip bila perlu)
        id: src
        shell: bash
        run: |
          if [ -z "$(find . -maxdepth 3 -name setup.sh -not -path './.git/*' | head -n1)" ]; then
            ZIP=$(ls ./*.zip | head -n1)
            echo "Mengekstrak $ZIP"
            mkdir -p src
            unzip -q -o "$ZIP" -d src
          fi
          SETUP=$(find . -maxdepth 4 -name setup.sh -not -path './.git/*' | head -n1)
          [ -n "$SETUP" ] || { echo "setup.sh tidak ditemukan"; exit 1; }
          echo "dir=$(dirname "$SETUP")" >> "$GITHUB_OUTPUT"

      - name: Terima lisensi Android
        shell: bash
        run: yes | flutter doctor --android-licenses || true

      - name: Jalankan setup.sh (analyze, test, build)
        shell: bash
        working-directory: ${{ steps.src.outputs.dir }}
        run: bash setup.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Ringkasan error (80 baris terakhir)
        if: failure()
        shell: bash
        run: |
          {
            echo '### 80 baris terakhir log'
            echo '```'
            tail -n 80 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-ai-debug-apk
          path: ${{ steps.src.outputs.dir }}/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Unggah log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
          
